services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [db]
    volumes: ["./storage:/app/storage"]
  worker:
    build: .
    command: python -m worker.worker
    env_file: .env
    depends_on: [db]
    volumes: ["./storage:/app/storage"]
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: aegisai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
